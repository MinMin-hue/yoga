version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: yoga-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: yoga_root_pwd
      MYSQL_DATABASE: yoga
      MYSQL_USER: yoga
      MYSQL_PASSWORD: yoga_pwd
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --explicit_defaults_for_timestamp=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pyoga_root_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yoga-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
    container_name: yoga-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

  admin:
    image: nginx:alpine
    container_name: yoga-admin
    restart: always
    depends_on:
      - server
    volumes:
      - ./apps/admin/dist:/usr/share/nginx/html:ro
      - ./apps/admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  h5:
    image: nginx:alpine
    container_name: yoga-h5
    restart: always
    depends_on:
      - server
    volumes:
      - ./apps/h5/dist/build/h5:/usr/share/nginx/html:ro
      - ./apps/h5/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

volumes:
  mysql_data:
  redis_data:
