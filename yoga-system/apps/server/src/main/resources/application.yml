server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

yoga:
  jwt:
    secret: ${YOGA_JWT_SECRET:yoga-studio-secret-key-please-change-in-production-2026}
    expire-hours: 24
  upload:
    dir: ${YOGA_UPLOAD_DIR:./uploads}
    base-url: ${YOGA_BASE_URL:http://localhost:8080}
